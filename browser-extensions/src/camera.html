<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selah Gesture Navigation</title>
  <link rel="stylesheet" href="camera.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">SELAH · OPEN SOURCE</p><h1>손동작 읽기</h1><p>카메라를 켠 뒤 손가락 스와이프로 웹 페이지를 이동하세요.</p></header>
    <section class="camera" aria-label="카메라 미리보기">
      <video id="video" muted autoplay playsinline aria-label="내 손 카메라 영상"></video>
      <canvas id="landmarks" aria-hidden="true"></canvas>
      <div id="cameraPlaceholder">카메라를 켜면 손 관절 추적을 보여드려요.</div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">카메라 꺼짐</p>
    <section class="controls" aria-label="손동작 설정">
      <label for="mode">좌우 스와이프</label>
      <select id="mode"><option value="buttons">페이지의 다음/이전 버튼 누르기</option><option value="horizontal">가로로 스크롤하기</option></select>
      <button id="start" type="button">카메라 켜기</button>
      <button id="stop" type="button" disabled>카메라 끄기</button>
    </section>
    <section class="verdict" aria-live="polite"><span>마지막 판정</span><strong id="verdict">아직 판정 없음</strong></section>
    <details><summary>제스처와 개인정보</summary><p>손바닥을 펴고 손가락을 왼쪽으로 빠르게 스와이프하면 다음 페이지/장, 오른쪽으로 스와이프하면 이전 페이지/장으로 이동합니다. 위·아래 스와이프는 본문을 부드럽게 스크롤합니다. 카메라 영상은 이 기기에서만 분석하고 저장하거나 전송하지 않습니다. 버튼을 눌러 시작할 때만 카메라 권한을 요청합니다.</p></details>
  </main>
  <script type="module" src="camera.js"></script>
</body>
</html>
