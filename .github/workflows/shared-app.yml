name: Shared app data and mobile source
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-unified-data.mjs
      - run: node --test scripts/test-legacy-migration.mjs
      - run: node scripts/check-semantic-theme-contrast.mjs
      - run: node scripts/check-platform-source.mjs
      - run: node scripts/test-shared-bundle.mjs
      - run: node scripts/check-feature-parity.mjs
        env:
          SELAH_PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/test-feature-parity.mjs
      - run: node mobile/scripts/copy-web.mjs --check

  windows-protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-windows-selah-protocol.cjs
      - run: node mobile/scripts/copy-web.mjs --check
      - run: powershell -ExecutionPolicy Bypass -File windows/Build-Selah-Release.ps1
