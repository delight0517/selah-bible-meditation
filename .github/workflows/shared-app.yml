name: Shared app data and mobile source
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-unified-data.mjs
      - run: node scripts/test-sync-without-guide.cjs
      - run: node scripts/test-reader-startup.cjs
      - run: node scripts/test-korean-bible-reader.cjs
      - run: node mobile/scripts/copy-web.mjs --check
