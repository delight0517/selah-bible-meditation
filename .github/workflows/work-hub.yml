name: Selah Work Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject invalid or overlapping work claims
        run: node scripts/work-hub.mjs check
      - name: Verify work hub CLI behavior and rejected-write safety
        run: node --test scripts/test-work-hub.mjs
