name: SelahMac
options:
  bundleIdPrefix: com.delight0517
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.delight0517.selah.mac
    PRODUCT_NAME: Selah
    INFOPLIST_KEY_CFBundleDisplayName: Selah
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_APP_SANDBOX: YES
    CODE_SIGN_ENTITLEMENTS: Selah.entitlements
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Selah:
    type: application
    platform: macOS
    info:
      path: Selah-Info.plist
      properties:
        CFBundleShortVersionString: "1.0.22"
        CFBundleVersion: "94"
        CFBundleURLTypes:
          - CFBundleURLName: Selah Reading
            CFBundleURLSchemes:
              - selah
    sources:
      - Sources
      - path: Resources
        type: folder
    entitlements:
      path: Selah.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        INFOPLIST_KEY_NSHighResolutionCapable: YES
