name: SelahMac
options:
  bundleIdPrefix: com.delight0517
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V3J8MR637G
    MARKETING_VERSION: "1.0.10"
    CURRENT_PROJECT_VERSION: "22"
    PRODUCT_BUNDLE_IDENTIFIER: com.delight0517.selah.mac
    PRODUCT_NAME: Selah
    INFOPLIST_KEY_CFBundleDisplayName: Selah
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_APP_SANDBOX: YES
    CODE_SIGN_ENTITLEMENTS: Selah.entitlements
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Selah:
    type: application
    platform: macOS
    info:
      path: Selah-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: Selah Reading
            CFBundleURLSchemes:
              - selah
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: ../mobile/www
        type: folder
        buildPhase: resources
    entitlements:
      path: Selah.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        INFOPLIST_KEY_NSHighResolutionCapable: YES
