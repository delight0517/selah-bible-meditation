<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">하나님을 더 알고 싶으신가요?</title>
  <desc id="desc">부드러운 아침 햇살이 드는 책상 위에 펼쳐진 성경과 작은 노트, 말씀 한 장부터 천천히 읽도록 초대하는 셀라</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8ebdf"/><stop offset="1" stop-color="#f5ead8"/></linearGradient>
    <linearGradient id="light" x2="1"><stop stop-color="#fff9e9" stop-opacity=".85"/><stop offset="1" stop-color="#fff9e9" stop-opacity="0"/></linearGradient>
  </defs>
