  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#26392d">
    <text x="82" y="116" font-size="22" font-weight="700" letter-spacing="5">SELAH · 말씀 묵상</text>
    <text x="78" y="274" font-size="58" font-weight="600" letter-spacing="-2">하나님을 더 알고 싶으신가요?</text>
    <text x="82" y="356" font-size="30" font-weight="500">말씀 한 장부터 천천히 읽어 보세요.</text>
    <text x="82" y="420" font-size="26" fill="#5f6c60">읽고, 마음에 남은 것을 기록해 보세요.</text>
  </g>
</svg>
