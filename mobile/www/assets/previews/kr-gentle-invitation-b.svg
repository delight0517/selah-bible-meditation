    <text x="82" y="116" font-size="22" font-weight="700" letter-spacing="5" fill="#d3dfce">SELAH · 말씀 묵상</text>
    <text x="78" y="274" font-size="54" font-weight="600" letter-spacing="-2">하나님을 더 알고 싶을 때,</text>
