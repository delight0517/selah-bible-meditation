<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">하나님을 더 알고 싶을 때, 말씀 곁에 잠시 머물러 보세요</title>
  <desc id="desc">차분한 녹색과 크림색의 묵상 노트, 펼쳐진 성경, 부담 없이 읽고 기록하도록 초대하는 셀라</desc>
